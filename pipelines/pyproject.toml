[project]
name = "pipelines"
version = "0.1.0"
description = "Pipelines for Mapterhorn processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imagecodecs>=2023.3.16",
    "mercantile>=1.2.1",
    "numpy>=1.24.4",
    "pillow>=10.4.0",
    "pmtiles>=3.4.1",
    "pyproj>=3.5.0",
    "python-ulid>=1.1.0",
    "rasterio>=1.3.11",
    "requests>=2.32.4",
    "scipy>=1.10.1",
    "supermercado>=0.2.0",
]

[project.urls]
Homepage = "https://mapterhorn.com"
Documentation = "https://github.com/mapterhorn/mapterhorn/blob/main/pipelines/README.md"
Repository = "https://github.com/mapterhorn/mapterhorn"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

# Packages sourced from conda-forge under pixi.
# The same names in [project.dependencies] are the PyPI
# fallback for non-pixi installs.
[tool.pixi.dependencies]
gdal = ">=3.13"
just = ">=1.58.0,<2"
openjdk = ">=25.0.2,<26"
awscli = ">=2.36.20,<3"

[tool.pixi.pypi-dependencies]
pipelines = { path = ".", editable = true }

[tool.pixi.tasks]
