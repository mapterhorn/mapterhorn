<html>

<head>
    <title>Mapterhorn Local Viewer</title>
    <meta charset="utf-8" />
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script type="text/javascript">

        const protocol = new pmtiles.Protocol({ metadata: true, errorOnMissingTile: true });

        maplibregl.addProtocol('mapterhorn', async (params, abortController) => {
            const parts = params.url.replace('mapterhorn://', '').split('/');

            const z = parseInt(parts[0]);
            const x = parseInt(parts[1]);
            const y = parseInt(parts[2]);

            for (let sourceZ = z; sourceZ >= 0; sourceZ--) {
                const scale = 2 ** (z - sourceZ);

                const sourceX = Math.floor(x / scale);
                const sourceY = Math.floor(y / scale);

                for (let childZ = z; childZ >= sourceZ; childZ--) {

                    if (childZ < z) {
                        continue;
                    }

                    const filename =
                        `${sourceZ}-${sourceX}-${sourceY}-${childZ}.pmtiles`;

                    let filepath;

                    if (sourceZ >= 7) {
                        const dirScale = 2 ** (sourceZ - 7);

                        const dirX = Math.floor(sourceX / dirScale);
                        const dirY = Math.floor(sourceY / dirScale);

                        filepath =
                            `pmtiles-store/7-${dirX}-${dirY}/${filename}`;
                    } else {
                        filepath =
                            `pmtiles-store/${filename}`;
                    }

                    try {
                        const p = new pmtiles.PMTiles(filepath);

                        const tile = await p.getZxy(z, x, y);

                        if (tile !== undefined) {
                            console.log(
                                `Using ${filepath} for ${z}/${x}/${y}`
                            );

                            return await protocol.tile(
                                {
                                    ...params,
                                    url: `pmtiles://${filepath}/${z}/${x}/${y}.webp`,
                                },
                                abortController
                            );
                        }
                    } catch (err) {
                    }
                }
            }

            throw new Error(`tile ${z}/${x}/${y} not found`);
        });

        const boundsSource = 'dehessen';

        const map = new maplibregl.Map({
            container: 'map',
            hash: 'map',
            zoom: 10.5,
            center: [9.0788, 47.1194],
            style: {
                version: 8,
                sources: {
                    hillshadeSource: {
                        type: 'raster-dem',
                        tiles: ['mapterhorn://{z}/{x}/{y}'],
                        encoding: 'terrarium',
                        tileSize: 512,
                        attribution: '<a href="https://github.com/mapterhorn/mapterhorn">© Mapterhorn</a>'
                    },
                    bounds: {
                        type: 'geojson',
                        data: `bounds_${boundsSource}.geojson`
                    },
                },
                layers: [
                    {
                        id: 'hillshade',
                        type: 'hillshade',
                        source: 'hillshadeSource',
                    },
                    {
                        id: 'bounds',
                        type: 'line',
                        source: 'bounds',
                        paint: {
                            'line-color': '#0f0',
                            'line-opacity': 0.2,
                        },
                    },
                ],
            },
        });

        class LogoControl {
            onAdd(map) {
                this._map = map;
                this._container = document.createElement('div');
                this._container.className = 'maplibregl-ctrl';
                this._container.innerHTML = '<a href="/"><img width=400 src="https://mapterhorn.github.io/.github/brand/screen/mapterhorn-logo.png"/></a>';
                this._container.style.marginBottom = '-11px';
                this._container.style.marginLeft = '-5px';
                return this._container;
            }
            onRemove() {
                this._container.parentNode.removeChild(this._container);
                this._map = undefined;
            }
        }
        map.addControl(new LogoControl(), 'bottom-left');

    </script>
</body>

</html>
